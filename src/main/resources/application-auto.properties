# Enable explicitly with the auto profile.
profitpilot.external-api.enabled=true
profitpilot.alpha-vantage.enabled=true

# Keep news requests disabled during import verification.
profitpilot.marketaux.enabled=false

# Check stored prices when the application starts.
profitpilot.sync.on-startup=true

# Check every two hours during the daytime in New York.
profitpilot.sync.cron=0 10 6,8,10,12,14,16,18 * * *
profitpilot.sync.zone=America/New_York

profitpilot.sync.symbols=IBM,AAPL,GOOGL,MSFT,AMZN,NVDA,JPM,JNJ,KO,XOM
profitpilot.sync.request-delay-ms=15000
